name: Build and Release PDFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDFs with Docker
        run: |
          make build NO_OPEN=1

      - name: Upload PDFs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pdf
